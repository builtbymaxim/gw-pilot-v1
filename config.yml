spi:
  unit_patterns:
  - '%'
  - tco2e
  - "tco\u2082e"
  - gwh
  - mwh
  - kt
  - mt
  - "\u20AC"
  - \\bmn\\b
  - \\bbn\\b
  - million
  - billion
  target_patterns:
  - \\bby\\s+(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b
  - \\buntil\\s+(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b
  - \\bno\\s+later\\s+than\\s+(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b
  - \\bat\\s+the\\s+latest\\s+(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b
  - \\bby\\s+(?:year[-\\s]?end|YE)\\s*(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b
  - \\bby\\s+end[-\\s]?of\\s+(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b
  - \\bthrough\\s+(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b
  baseline_patterns:
  - \\bbase year\\s+20\\d{2}\\b
  - \\bbaseline\\s+20\\d{2}\\b
  - \\bvs\\.?\\b
  - \\brelative to\\s+20\\d{2}\\b
  strict_excludes:
  - \\bFY\\s?20\\d{2}\\b
  - \\bQ[1-4]\\s?20\\d{2}\\b
  - \\b(in|during|as of)\\s+20\\d{2}\\b
nli:
  model: facebook/bart-large-mnli
  hypothesis: This sentence states a measurable target.
  gated_regex: "(?ix)\n(?=.*(?:%|tco2e|tco\u2082e|co2|co\u2082|ghg|tonnes?|kwh|mwh|gwh|mw|kt|mt|scope\\\
    s*[123]|net\\s*zero))\n(\n  \\b(?:by|until|no\\s+later\\s+than|at\\s+the\\s+latest|through)\\\
    s+(?:20\\d{2}|2\\W*0\\W*\\d\\W*\\d)\\b\n| \\bby\\s+(?:year[-\\s]?end|YE)\\s*(?:20\\\
    d{2}|2\\W*0\\W*\\d\\W*\\d)\\b\n| \\bby\\s+end[-\\s]?of\\s+(?:20\\d{2}|2\\W*0\\\
    W*\\d\\W*\\d)\\b\n)"
  tau: null
ci:
  winsor_pct:
  - 1
  - 99
  unit_map:
    t: 1
    kt: 1000
    mt: 1000000
weights:
  vui: 0.45
  r_spi: 0.35
  r_ci: 0.2
bands:
  low: 0.3
  med: 0.6
logging:
  include_regex_hits: true
